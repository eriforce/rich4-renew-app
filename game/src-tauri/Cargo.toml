[package]
name = "rich4"
version = "0.1.0"
description = "大富翁4 重制版（Windows / macOS 便携版桌面壳）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
